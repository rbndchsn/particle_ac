# Per-document summary panels. Hand-written from each research stream's findings.
# key_findings: 3-5 bullets, the strongest documented material
# rejected: what the stream examined and struck out
# note: optional caveat surfaced at the top of the page

02_theory_critique/theoretical_weaknesses_v1.md:
  key_findings:
    - "Naturalness carried a <strong>pre-registered falsification condition</strong> set inside the field: an explicit sub-TeV bound published with the statement that finding no such phenomena would mean the criterion failed. The condition was met."
    - "The same author conceded the point in 2017 — “a doctor who is unable to find the right diagnosis cannot simply declare the patient healed.”"
    - "The 2023 US strategy report contains <strong>zero</strong> instances of “naturalness”, “hierarchy problem”, “fine-tuning” or “unnatural” across all 379,741 characters, while still paraphrasing the argument."
    - "The fine-tuning threshold moved by stipulation across three decades (Δ=10 → Δ=20 → 100, with 1000 “or higher” acceptable) while gluino limits rose from ~310 GeV to ~2.3 TeV."
    - "750 GeV diphoton: global significances of 2.1σ and 1.6σ were stated in the abstracts; 200–350 theory papers followed anyway."
  rejected:
    - "That naturalness was <em>merely</em> aesthetic — its effective-field-theory grounding is a real argument and survives."
    - "That no-lose rhetoric is empty — the Higgs no-lose claim succeeded in 2012."
    - "That axion research was funding-suppressed — DOE selected 4:1 WIMP:axion from 10:3 submissions, which is proportionate."
    - "That goalposts moved only after exclusions — split SUSY abandoned naturalness in 2004, before the LHC."

03_hardware_systems/trigger_data_destruction_v1.md:
  key_findings:
    - "40 MHz of crossings against roughly 1–3 kHz written. Full readout would be <strong>40 TB/s</strong> against about 1 GB/s stored. Rejected events are, in the field’s own words, lost forever."
    - "Menus select events “believed in advance of being interesting… theoretical models and detailed Monte Carlo simulations guide the definition of the trigger menus.”"
    - "CMS allocates high-level trigger rate roughly one third each to new-physics searches, measurements and flavour physics — by committee, annually."
    - "CMS states it lacked a B→K<sup>(*)</sup>ee trigger, which “prevented the measurements of R<sub>K</sub> and R<sub>K*</sub>.” Prevented, not delayed."
    - "Surviving claim: trigger error is structurally asymmetric. False positives cost measured, budgeted bandwidth; false negatives cost unrecoverable events and are never integrated over signature space."
  rejected:
    - "That some physics is <strong>unobservable in principle</strong> — false. Zero-bias and enhanced-bias streams give an effective prescale near 40,000 and an unbiased sample of 0.5–1 fb⁻¹."
    - "That trigger bandwidth is a hard physical limit — LHCb and ALICE abandoned hardware triggers entirely."
    - "That the astrophysical detectors share the problem — IceCube archives all raw waveforms."
    - "That the field does not acknowledge the issue — it does, in print."

03_hardware_systems/hardware_supply_chain_v1.md:
  key_findings:
    - "Accelerator-grade Nb₃Sn: the HL-LHC specification was met by <strong>one</strong> supplier, against eight qualified for ITER."
    - "World RRP output is 5–10 t/yr and PIT under 1 t/yr, against projected FCC demand of 8,000–10,000 t."
    - "Brazil holds roughly <strong>93%</strong> of world niobium mine production; one firm holds 77–90% of that. The US produces none."
    - "“Only two companies in the world” make helium turbo-expanders of the required size."
    - "CERN member states receive 94% of direct contracts but 77% of value added; France and Switzerland together take 58% of direct spend."
  rejected:
    - "That Russian crystal supply was lost after 2022 — that vendor failed commercially <em>before</em> then; the 2022 dependency was on Russian funding, not crystals."
    - "That procurement is captured by the largest contributors — Germany and the UK are documented as poorly balanced, i.e. under-returned."
  note: "Several supplier identities are recorded as <em>not publicly available</em> rather than inferred — foundry names, per-firm dipole contract values, per-vendor klystron and SiPM shares."

04_software_algorithmic/software_stack_bias_v1.md:
  key_findings:
    - "Both general-purpose experiments’ nominal hadronisation descends from <strong>one</strong> manual fit whose authors describe making “(subjective) decisions” and set a shower parameter to “effectively mimic” a missing calculation."
    - "One experiment holds those parameters fixed entirely; the other tunes ten parameters on top of them."
    - "A published study finds the two-generator spread does not bound the spread to a third: “using only two generators would badly underestimate the true uncertainty.”"
    - "In unfolding, the simulation’s own prediction is the regularising prior — “the dependence on the start values, typically taken to be the Monte Carlo truth, provides a regularisation.”"
    - "By 2025 the reproducibility of some Run-1 and Run-2 searches has “already been lost within ATLAS and CMS.”"
  rejected:
    - "That combinations ignore inter-experiment correlation — <strong>false, and documented to the contrary.</strong> Correlation is modelled explicitly, at ρ≈0.5 for shared modelling terms, with per-category scans published."
    - "That correlation treatment would move published results — for the top mass it is numerically immaterial."
    - "That ROOT is bus-factor-one — 15 maintainers across 4 institutions is concentration, not key-person risk."
    - "That open-data limits reflect suppression — the person-power explanation wins, and the damning quotes are the collaborations’ own."
  note: "Surviving inference: the correlation coefficient appears calibrated on <em>procedural</em> difference between collaborations rather than shared model lineage, where the true value for hadronisation is plausibly near 1."

05_publication_governance/publication_governance_v1.md:
  key_findings:
    - "The field’s own reinterpretation inventory: full statistical likelihoods released for <strong>two</strong> analyses; efficiency maps in “very few cases”; machine-learning analyses “cannot be reproduced at all outside the experimental collaboration.”"
    - "ATLAS authorship is earned by 80 eight-hour days plus a year, after which a name appears on every paper; the Authorship Committee’s remit explicitly excludes responsibility for content."
    - "P5 recuses four of 32 members, for national-lab employment, from a single acceptance vote. All 32 are particle or accelerator physicists. The ESPP mandate has no conflict-of-interest provisions at all."
    - "Costs are taken from proponents; the subcommittee was barred from producing its own estimates."
    - "FCC: ~€9bn (2019) → CHF 15.3bn (2025); tunnel 100 → 90.7 km; FCC-hh 100 → 85 TeV; operations late-2050s → early-2070s."
  rejected:
    - "That null results are suppressed — <strong>the reverse holds.</strong> Physics ranks 12th of 20 fields for positive-result bias; HEP publishes exclusions thoroughly."
    - "That there is no conflict-of-interest regime — there is one, and it does recuse members."
    - "That no panel member lacks a stake — false; at least one documented counterexample."
    - "That critics are professionally punished — unsupported. The case usually cited was a Code of Conduct matter about gender, not collider criticism."
  note: "Surviving inference: the exemplary null-result record and the weak external auditability have the <em>same</em> cause — the collaboration is the publishing unit, so there is no file drawer and no outside check."

06_dissent_register/legitimacy_confrontations_v1.md:
  key_findings:
    - "<strong>60 confrontations catalogued, 1961–2026</strong>, stated as a floor with inclusion criteria: 3 validity, 21 priority/cost, 12 safety, 15 epistemic/sociological, 9 specific-result."
    - "The ratio is the finding. <strong>Three of sixty</strong> dispute the physics — all three outside peer review, none a practising particle physicist."
    - "All 36 scientists in the priority and epistemic categories, including five Nobel laureates, concede in writing that the machines work and the Standard Model is confirmed. The leading anti-FCC campaign says so in its own report."
    - "Philip Anderson’s Senate testimony, 24 February 1989: HEP received roughly ten times more per capita; officials “deliberately misleading Congress.” The SSC died 282–143 on 19 October 1993, ~$2bn spent, $203m undocumented."
    - "Seven legal proceedings across four jurisdictions produced <strong>zero merits rulings</strong>. Every court declined to reach the physics."
    - "Volkov (2024): an independent recalculation of tenth-order QED disagrees with the standard result at 5σ, published in Physical Review D."
  rejected:
    - "The fabrication thesis, in every form examined."
    - "Unzicker’s and Consa’s validity claims — Consa’s history is retained, the manipulation inference rejected."
    - "The retaliation thesis — Krumhansl became APS President two years after testifying against the SSC."
    - "“The courts found the LHC safe” — they did not; they declined jurisdiction."
    - "Pickering read as a validity critic — his contingency thesis is not an error claim, and the distinction is the one this document turns on."

07_epistemic_audit/known_versus_assumed_v1.md:
  key_findings:
    - "Electron g/2 = 1.001159652180(13) — 0.13 parts per trillion, 15 significant figures, matched to ~1 part in 10¹² by a 12,672-diagram five-loop calculation. This is the most precisely confirmed prediction in science."
    - "Calibration point that matters: the test is limited by the <em>imported</em> value of α, and the two best determinations differ from the g/2 value by 2.1σ and 3.9σ."
    - "The inferential chain does <strong>not</strong> turn model-dependent at calibration — ATLAS jets are calibrated to particle level at 0.3% at 300 GeV, anchored on test-beam and in-data balance."
    - "It turns model-dependent at two later steps: the object-to-entity mapping (jet→parton, missing energy→invisible particle), and the acceptance factor computed under the hypothesis being tested."
    - "Genuinely alive: axions, SUSY as a framework, composite Higgs, heavy sterile neutrinos. Dead or untestable: technicolor, preons, ADD, MOND-as-replacement, eV sterile neutrinos."
    - "Real unexplained anomalies: the gallium deficit (>5σ), dark energy tension (3.1–4.2σ), neutrino-mass cosmology tension, strong CP, baryon asymmetry."
  rejected:
    - "Plasma cosmology, the electric universe, “quarks don’t exist”, Santilli, and all fabrication claims."
    - "Unzicker’s falsity claims — his auditability point survives; nothing else does."
    - "That the muon g-2 anomaly is resolved — it is <em>displaced</em>, not resolved; the two determinations remain incompatible at ~3σ."
    - "That R(K) is a live anomaly — it dissolved, with a published cause."

08_evidential_audit/proof_failure_modes_v1.md:
  key_findings:
    - "The regress bottoms out, and the chain is traceable: ion-beam analysis → a certified antimony implant → ICP-MS → a gravimetric calibration solution → weighed high-purity metal → the SI definitions. A blind test reproduced a certified fluence to <strong>−0.18 ± 0.11%</strong> against a value fixed beforehand."
    - "The cheapest high-payoff gap found anywhere: electronic stopping power is the dominant uncertainty in ion-beam analysis at 0.8% inside a 1% budget, is <em>pinned to the certified standard</em>, and <strong>no published multi-energy consistency check exists</strong>."
    - "The electron g−2's largest systematic is a cyclotron lineshape that does not match prediction — the measuring group's own words — and nobody outside that group has investigated it. The group advises against averaging its own 2008 and 2023 results."
    - "For five years the canonical five-loop QED coefficient was wrong by roughly five times its own quoted uncertainty, because 98 of 6,354 diagrams were under-sampled. It was caught only because one person outside the originating group redid the calculation. <strong>No mechanism in the field would otherwise have found it.</strong>"
    - "No data-only characterisation exists of the fake missing-energy tail in the high-multiplicity regime where searches actually have sensitivity."
    - "No published scan of correlation assumptions exists for the 2012 discovery significance itself — the quantity for which the two experiments' independence was rhetorically load-bearing."
  rejected:
    - "That these failure modes evidence fabrication. Mapping a failure mode is not evidence that it occurred, and conflating the two would void the document."
    - "That Volkov's 5σ is a live crack in QED. It was live from 2019 to 2024 and is <strong>resolved, in Volkov's favour</strong> — reporting it as open would be a factual error."
    - "That the g−2 discrepancy with the caesium α value is evidence of new physics. The two α determinations disagree with <em>each other</em> at 5.5σ; it is evidence about α."
    - "That ATLAS and CMS agreement is worthless. The combinations publish their correlation assignments, state that no category was identified at ρ=1, and scan them."
    - "That the experimenter's regress makes instrumental knowledge impossible. It is a question to ask of each case, not a general impossibility result."
  note: "Strongest anchoring was found at the Higgs — spurious-signal criterion, blinding, independent teams — and at jets, where the parton inference rests on inclusive deep-inelastic and neutrino data that excluded three named alternatives, not on jets at all."

09_anchoring_gradient/anchoring_gradient_v1.md:
  key_findings:
    - "The gradient is real, but the governing variable is not energy — it is <strong>whether anything in use depends on the observable</strong>. Energy only correlates because usable cross sections fall with it."
    - "The strongest counterexample found, and it is instructive: LHC radiation-to-electronics and machine protection is a genuine external anchor operating at TeV energies — 80 Run-2 beam dumps from radiation faults, FLUKA dose predictions tested against detectors, 362 MJ of stored beam. But its reach scales with cross section, so it anchors inclusive soft production and <em>provably cannot reach the rare-process tail where discovery claims live</em>."
    - "The official economic case for the LHC assigns <strong>1.7%</strong> of its €16.4bn benefit to scientific knowledge, and 66% to spillover and human capital. Both it and the UK national evaluation monetise the physics bibliometrically."
    - "Surviving thesis, narrowed: <strong>accountability does not travel with claim-strength.</strong>"
  rejected:
    - "<strong>That spending runs inversely to anchoring — false, and contradicted by the appropriation table.</strong> NNSA Weapons Activities took $19.3bn in FY2025 against High Energy Physics's $1.22bn; Basic Energy Sciences took 2.1× HEP. Inside HEP, the neutrino programme (~$680M) outspends Energy Frontier, Cosmic Frontier and theory combined (~$435M)."
    - "That unanchored means untested. Electroweak fits predicted the top mass at 140–190 GeV and a light Higgs before measurement; lattice QCD predicted B<sub>c</sub> and f<sub>D+</sub>."
    - "That technological spin-offs anchor the physics. MRI magnets, hadron therapy, the Web and grid computing anchor the engineering."
    - "That the gradient is unique to particle physics. The same shape appears in cosmology, string theory and deep-time geology."
    - "That anchored means known. In the most heavily anchored domain of all, plain density-functional theory underestimates band gaps by around 49%."
  note: "The tautology objection — that this gradient is simply what “frontier” means — is conceded in full for the gradient's existence. What defeats it for the thesis as a whole is that the spending half was empirically falsifiable and was falsified: a tautology cannot be refuted by an appropriation table."

10_financial_investigation/cost_and_procurement_v1.md:
  found_label: What the collection holds
  struck_label: What cuts the other way
  key_findings:
    - "<strong>The $203m, chased to source — and it is not an audit figure.</strong> It traces to a 1993 New York Times report of a DOE Inspector General <em>draft</em>. The verified figure is DOE/IG-0389 (1996): “The OIG questioned $207 million in contractor costs.” No document states the two are the same, and the implied denominator (~$508m) is inconsistent with total SSC spend, so the audit covered a sub-period or a single contractor."
    - "On the same project, on the same date, DOE's own estimate showed a <strong>$124m</strong> overrun while an independent Departmental assessment showed <strong>~$1.6bn</strong> — a factor of thirteen."
    - "DOE-OIG-23-29: Fermilab's operator had <strong>$162,018,139.47 questioned</strong> of $413.9m claimed for FY2018, of which $159.47m was unsupported indirect costs — and DOE “did not review or approve” the contractor's indirect cost rates."
    - "FCC-ee: <strong>10.5 → 15.32 BCHF (+45.9%)</strong> while the tunnel shrank 100 → 90.7 km. FCC-hh rose while design energy fell 100 → 85 TeV and magnet field 16 → 14 T. CERN's own 2023 model priced a 25%-overrun risk case at 13.8 BCHF; the actual estimate exceeded it."
    - "HL-LHC baseline 950 → 1,140 MCHF (+20%) in a document stating changes were “limited within +10%”, with <strong>no risk contingency in the baseline at all</strong>, by policy."
    - "<strong>Three named LHC suppliers carry criminal or competition findings in other markets:</strong> Alstom pleaded guilty to FCPA books-and-records falsification ($772.29m); Furukawa Electric to Sherman Act bid rigging and price fixing ($200m, three executives jailed); Air Liquide and Linde — the world's only two qualified helium turbo-expander makers — were both named in a Brazilian market-allocation case."
    - "<strong>The structural finding.</strong> CERN's own papers name the “risk and high cost of sole supplier” for Nb₃Sn, a 40% weight-price premium, degrading yield at the single qualified vendor, and $13/kA·m against $7.50 in 2005. Nobody has ever benchmarked or audited that pricing. CERN publishes its non-competitive-award threshold but not the count or value; publishes no internal audit output, no senior remuneration, no interest register, no post-employment restriction; and is immune from national jurisdiction, so a bid protest cannot exist. <em>The conditions for overcharging are documented by CERN itself. The data to test it is structurally unavailable to outsiders.</em>"
  rejected:
    - "<strong>Particle physics is not a cost-overrun outlier.</strong> JWST +870%, ITER +340%, LBNF/DUNE +286%, SSC +108%, NIF +57–88%, LHC +65%, FCC-ee +46%, SKA +36%, HL-LHC +20%. The two worst are not particle physics."
    - "GAO-08-641 found roughly <strong>70% of 42 DOE Office of Science projects within committed cost, and 89% of completed ones</strong> — better than the megaproject norm."
    - "DOE-OIG-26-39 found <strong>zero questioned costs</strong> at SLAC across four fiscal years."
    - "<strong>No prosecution, debarment, bid protest or contract dispute arising from a CERN contract exists anywhere in the record.</strong> The supplier misconduct above is all in other markets."
    - "The fringe allegations (CERN “collected trillions”, undisclosed Rothschild and Rockefeller donations, audit impossible under Swiss banking law) are recorded in full with the contradicting documents named inline — the United States is not a CERN member state, and audits by Poland's NIK and the Portuguese Court of Auditors are published."
  note: "This is a <strong>collection-phase document and carries no assessment section by design</strong>. Every item is tagged by source class (audit, court, official, press, advocacy, anonymous) and status (verified, reported, alleged, unverifiable), and nothing encountered was dropped — 166 tagged items, 102 verified, 54 alleged. It closes instead with 51 enumerated gaps, each naming the document that would answer it."

00_method/consistency_audit_v1.md:
  found_label: What the audit found
  struck_label: Checked and sound
  key_findings:
    - "<strong>28 inconsistencies across fourteen documents and the landing page</strong>, six of them the kind a specialist catches on first reading. All six were on the most-read page."
    - "“Full statistical likelihoods for two analyses” was a 2020 snapshot printed as current; the archive's own 2025 source records <strong>41</strong>. Off by a factor of twenty on the figure carrying the literature section."
    - "The thesis asserted the naturalness argument “was removed” from funding documents. The archive says the <em>vocabulary</em> was dropped and the argument kept in paraphrase — and the page contradicted itself eight lines later."
    - "Giudice's “a doctor unable to find the right diagnosis cannot simply declare the patient healed” was quoted as his concession. It is his <em>counterargument</em> — his refusal to drop the problem."
    - "A citation bug corrupting published output: two reference continuation lines beginning “2004.” and “2013.” were parsed as list items, so the page rendered 46 entries against 44 and <strong>every in-text citation from 10 upward resolved to the wrong source</strong>."
  rejected:
    - "The load-bearing numbers check out across documents: 379,741 characters; 1.7% of €16.4bn; $162,018,139.47; 93% niobium; 1-vs-8 Nb₃Sn suppliers; the 40% premium; $13 against $7.50; 3 of 60; 282–143; 0.13 parts per trillion."
    - "The cost-overrun baseline and the “not an outlier” conclusion are fully supported."
  note: "This audit is the archive auditing itself, and it found the same failure mode the archive documents in others: a correction filed at line 614 of a 682-line file, behind five live statements of the claim it retracts. Every finding here has been applied."
